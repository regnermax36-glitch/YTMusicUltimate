name: main iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Cache Swift Packages
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate --spec project.yml

    - name: Build and Package IPA
      run: |
        xcodebuild -project MaxRegneros.xcodeproj \
                   -scheme MaxRegneros \
                   -destination 'generic/platform=iOS' \
                   -configuration Release \
                   -derivedDataPath ${{ github.workspace }}/build/derived \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build

        APP=$(find "${{ github.workspace }}/build/derived/Build/Products" \
          -name "*.app" -type d \
          -not -path "*Test*" \
          -not -path "*PlugIns*" \
          | head -1)

        echo "Found: $APP"
        mkdir -p "${{ github.workspace }}/build/ipa/Payload"
        cp -r "$APP" "${{ github.workspace }}/build/ipa/Payload/"
        cd "${{ github.workspace }}/build/ipa"
        zip -r MaxRegneros.ipa Payload/
        echo "IPA_PATH=${{ github.workspace }}/build/ipa/MaxRegneros.ipa" >> $GITHUB_ENV

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaxRegneros-${{ github.run_number }}
        path: ${{ env.IPA_PATH }}
        retention-days: 14
